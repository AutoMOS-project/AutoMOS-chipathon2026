# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "AutoECG"
  team: "AutoMOS"
  discord: "rodrigom1199"
  description: "Wearable-grade analog front-end (AFE) for continuous ECG monitoring"
  lvs_config: "lvs_config.json"

