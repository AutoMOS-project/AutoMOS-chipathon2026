# ======================================================
# Pinout Configuration (18-pin Layout)
# ======================================================
pinout:
  - pin: 1
    name: "VDD"
    type: "Power"
    direction: "Input"
    description: "3.3V Power Supply"

  - pin: 2
    name: "EINP"
    type: "Analog"
    direction: "Input"
    description: "Positive Electrodes Input"

  - pin: 3
    name: "EINN"
    type: "Analog"
    direction: "Input"
    description: "Negative Electrodes Input"

  - pin: 4
    name: "GND"
    type: "Power"
    direction: "Input"
    description: "Ground Reference (0V)"

  - pin: 5
    name: "VOUTP"
    type: "Analog"
    direction: "Output"
    description: "Positive Analog Output"

  - pin: 6
    name: "VOUTN"
    type: "Analog"
    direction: "Output"
    description: "Negative Analog Output"

  - pin: 7
    name: "B0"
    type: "Digital"
    direction: "Input"
    description: "PGA Gain Bit 0 (x1)"

  - pin: 8
    name: "B1"
    type: "Digital"
    direction: "Input"
    description: "PGA Gain Bit 1 (x2)"

  - pin: 9
    name: "B2"
    type: "Digital"
    direction: "Input"
    description: "PGA Gain Bit 2 (x4)"

  - pin: 10
    name: "B3"
    type: "Digital"
    direction: "Input"
    description: "PGA Gain Bit 3 (x8)"

  - pin: 11
    name: "B4"
    type: "Digital"
    direction: "Input"
    description: "PGA Gain Bit 4 (x16)"

  - pin: 12
    name: "CLK_PGA"
    type: "Digital"
    direction: "Input"
    description: "Clock Signal for PGA"

  - pin: 13
    name: "VBCN"
    type: "Analog"
    direction: "Input/Output"
    description: "Cascode Bias Voltage (N-type)"

  - pin: 14
    name: "VBCP"
    type: "Analog"
    direction: "Input/Output"
    description: "Cascode Bias Voltage (P-type)"

  - pin: 15
    name: "VCM"
    type: "Analog"
    direction: "Input/Output"
    description: "Common-Mode Voltage"

  - pin: 16
    name: "IBIAS_1U"
    type: "Analog"
    direction: "Input/Output"
    description: "1uA Bias Current Reference"

  - pin: 17
    name: "DRLOUT"
    type: "Analog"
    direction: "Output"
    description: "Driven Right Leg Output"

  - pin: 18
    name: "CLK_INA"
    type: "Digital"
    direction: "Input"
    description: "Clock Signal for INA"
