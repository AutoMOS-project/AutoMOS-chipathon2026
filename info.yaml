# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "AutoECG"
  team: "AutoMOS"
  discord: "rodrigom99"
  description: "Wearable-grade CMOS 180nm analog front-end for continuous ECG monitoring with programmable gain and high common-mode rejection."
  lvs_config: "./designs/libs/layout/lvs_config.json"

pins:
  - name: VDD3V3
    io_type: power

  - name: VINP
    io_type: analog
    secondary_esd: false

  - name: VINN
    io_type: analog
    secondary_esd: false

  - name: VSS
    io_type: ground

  - name: VOUTP
    io_type: analog
    secondary_esd: true

  - name: VOUTN
    io_type: analog
    secondary_esd: true

  - name: SWM1
    io_type: input_cmos

  - name: SWM2
    io_type: input_cmos

  - name: SWM4
    io_type: input_cmos

  - name: SWM8
    io_type: input_cmos

  - name: SWM16
    io_type: input_cmos

  - name: SW0
    io_type: input_cmos

  - name: VB0V94
    io_type: bidirectional

  - name: VB1V3
    io_type: bidirectional

  - name: VCM
    io_type: bidirectional

  - name: 1UA
    io_type: bidirectional

  - name: IB
    io_type: bidirectional

  - name: VG
    io_type: analog
    secondary_esd: true

  - name: CLK
    io_type: input_cmos
